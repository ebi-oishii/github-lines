<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optTitle">GitHub Lines</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>GitHub Lines</h1>
      <p class="lede" data-i18n="optLede"></p>
    </header>

    <section class="card">
      <h2 data-i18n="optTokens"></h2>
      <p class="hint" data-i18n-html="optTokensHint1"></p>

      <div id="token-list"></div>
      <button class="btn" id="add-token" type="button" data-i18n="optAddToken"></button>

      <p class="hint">
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer"
           data-i18n="optTokenLink"></a>
        <span data-i18n-html="optTokensHint3"></span>
      </p>
    </section>

    <template id="token-row-template">
      <div class="token-row">
        <div class="token-head">
          <label class="radio" data-i18n-title="optTokenDefaultTitle">
            <input type="radio" name="default-token" class="token-default">
            <span data-i18n="optTokenDefault"></span>
          </label>
          <input class="token-label" type="text" spellcheck="false" data-i18n-placeholder="optTokenLabelPlaceholder">
          <button class="btn quiet token-remove" type="button"
                  data-i18n-label="optTokenRemoveLabel" data-i18n="optTokenRemove"></button>
        </div>
        <label class="field">
          <span class="label" data-i18n="optTokenValue"></span>
          <input class="token-value" type="password" autocomplete="off" spellcheck="false"
                 data-i18n-placeholder="optTokenValuePlaceholder">
        </label>
        <label class="field">
          <span class="label" data-i18n="optTokenOwners"></span>
          <input class="token-owners" type="text" spellcheck="false" placeholder="my-name, my-org">
        </label>
        <div class="token-actions">
          <button class="btn token-verify" type="button" data-i18n="optTokenVerify"></button>
          <span class="status token-status" data-tone="idle"></span>
        </div>
      </div>
    </template>

    <section class="card">
      <h2 data-i18n="optCounting"></h2>
      <label class="check">
        <input type="radio" name="exactLinesMode" value="auto">
        <span data-i18n-html="optModeAuto"></span>
      </label>
      <label class="check">
        <input type="radio" name="exactLinesMode" value="manual">
        <span data-i18n-html="optModeManual"></span>
      </label>
      <label class="check">
        <input type="radio" name="exactLinesMode" value="off">
        <span data-i18n-html="optModeOff"></span>
      </label>
      <p class="hint" data-i18n="optModeHint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optDisplay"></h2>
      <label class="check">
        <input id="showInlineBars" type="checkbox">
        <span data-i18n="optShowBars"></span>
      </label>
      <label class="check">
        <input id="showTreemapButton" type="checkbox">
        <span data-i18n="optShowTreemap"></span>
      </label>
      <p class="hint" data-i18n="optThresholdsHint"></p>
      <div class="row">
        <label class="field narrow">
          <span class="label" data-i18n="optWarn"></span>
          <input id="warnLines" type="number" min="1" step="50">
        </label>
        <label class="field narrow">
          <span class="label" data-i18n="optDanger"></span>
          <input id="dangerLines" type="number" min="1" step="50">
        </label>
      </div>
    </section>

    <details class="card fold">
      <summary data-i18n="optAdvanced"></summary>

      <div class="fold-body">
        <label class="check">
          <input id="respectGitattributes" type="checkbox">
          <span data-i18n-html="optRespectGitattributes"></span>
        </label>
        <label class="check">
          <input id="excludeGenerated" type="checkbox">
          <span data-i18n="optExcludeGenerated"></span>
        </label>
        <label class="field">
          <span class="label" data-i18n="optPatterns"></span>
          <textarea id="excludePatterns" rows="10" spellcheck="false"></textarea>
        </label>
        <p class="hint" data-i18n="optPatternsHint"></p>

        <div class="row">
          <label class="field narrow">
            <span class="label" data-i18n="optMaxFetch"></span>
            <input id="maxExactFetch" type="number" min="0" step="50">
          </label>
          <label class="field narrow">
            <span class="label" data-i18n="optConcurrency"></span>
            <input id="concurrency" type="number" min="1" max="16" step="1">
          </label>
        </div>
        <p class="hint" data-i18n="optCacheHint"></p>

        <div class="row cache-row">
          <button class="btn" id="clear-cache" type="button" data-i18n="optClearCache"></button>
          <span class="hint" id="cache-stats">…</span>
        </div>
      </div>
    </details>

    <footer class="foot">
      <span class="hint" data-i18n="optAutosave"></span>
      <span class="status" id="save-status" data-tone="idle"></span>
      <span class="spacer"></span>
      <button class="btn quiet" id="reset" type="button" data-i18n="optReset"></button>
    </footer>
  </main>

  <script src="../lib/namespace.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/patterns.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
