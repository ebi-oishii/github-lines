<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="title">GitHub Lines</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>GitHub Lines</h1>
      <p class="lede" data-i18n="lede"></p>
      <p class="guide">
        <a href="https://github.com/ebi-oishii/github-lines#readme" target="_blank" rel="noreferrer"
           data-i18n="setupGuide"></a>
      </p>
    </header>

    <section class="card">
      <h2 data-i18n="tokens"></h2>
      <p class="hint" data-i18n-html="tokensHint1"></p>

      <div id="token-list"></div>
      <button class="btn" id="add-token" type="button" data-i18n="addToken"></button>

      <p class="hint">
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer"
           data-i18n="tokenLink"></a>
        <span data-i18n-html="tokensHint3"></span>
      </p>
    </section>

    <template id="token-row-template">
      <div class="token-row">
        <div class="token-head">
          <label class="radio" data-i18n-title="tokenDefaultTitle">
            <input type="radio" name="default-token" class="token-default">
            <span data-i18n="tokenDefault"></span>
          </label>
          <input class="token-label" type="text" spellcheck="false" data-i18n-placeholder="tokenLabelPlaceholder">
          <button class="btn quiet token-remove" type="button"
                  data-i18n-label="tokenRemoveLabel" data-i18n="tokenRemove"></button>
        </div>
        <label class="field">
          <span class="label" data-i18n="tokenValue"></span>
          <input class="token-value" type="password" autocomplete="off" spellcheck="false"
                 data-i18n-placeholder="tokenValuePlaceholder">
        </label>
        <label class="field">
          <span class="label" data-i18n="tokenOwners"></span>
          <input class="token-owners" type="text" spellcheck="false" placeholder="my-name, my-org">
        </label>
        <div class="token-actions">
          <button class="btn token-verify" type="button" data-i18n="tokenVerify"></button>
          <span class="status token-status" data-tone="idle"></span>
        </div>
      </div>
    </template>

    <section class="card">
      <h2 data-i18n="counting"></h2>
      <label class="check">
        <input type="radio" name="exactLinesMode" value="auto">
        <span data-i18n-html="modeAuto"></span>
      </label>
      <label class="check">
        <input type="radio" name="exactLinesMode" value="manual">
        <span data-i18n-html="modeManual"></span>
      </label>
      <label class="check">
        <input type="radio" name="exactLinesMode" value="off">
        <span data-i18n-html="modeOff"></span>
      </label>
      <p class="hint" data-i18n="modeHint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="display"></h2>
      <label class="check">
        <input id="showInlineBars" type="checkbox">
        <span data-i18n="showBars"></span>
      </label>
      <label class="check">
        <input id="showTreemapButton" type="checkbox">
        <span data-i18n="showTreemap"></span>
      </label>
      <label class="field narrow">
        <span class="label" data-i18n="language"></span>
        <select id="locale">
          <option value="" data-i18n="languageAuto"></option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
      <p class="hint" data-i18n="thresholdsHint"></p>
      <div class="row">
        <label class="field narrow">
          <span class="label" data-i18n="warn"></span>
          <input id="warnLines" type="number" min="1" step="50">
        </label>
        <label class="field narrow">
          <span class="label" data-i18n="danger"></span>
          <input id="dangerLines" type="number" min="1" step="50">
        </label>
      </div>
    </section>

    <details class="card fold">
      <summary data-i18n="advanced"></summary>

      <div class="fold-body">
        <label class="check">
          <input id="respectGitattributes" type="checkbox">
          <span data-i18n-html="respectGitattributes"></span>
        </label>
        <label class="check">
          <input id="excludeGenerated" type="checkbox">
          <span data-i18n="excludeGenerated"></span>
        </label>
        <label class="field">
          <span class="label" data-i18n="patterns"></span>
          <textarea id="excludePatterns" rows="10" spellcheck="false"></textarea>
        </label>
        <p class="hint" data-i18n="patternsHint"></p>

        <div class="row">
          <label class="field narrow">
            <span class="label" data-i18n="maxFetch"></span>
            <input id="maxExactFetch" type="number" min="0" step="50">
          </label>
          <label class="field narrow">
            <span class="label" data-i18n="concurrency"></span>
            <input id="concurrency" type="number" min="1" max="16" step="1">
          </label>
        </div>
        <p class="hint" data-i18n="cacheHint"></p>

        <div class="row cache-row">
          <button class="btn" id="clear-cache" type="button" data-i18n="clearCache"></button>
          <span class="hint" id="cache-stats">…</span>
        </div>
      </div>
    </details>

    <footer class="foot">
      <span class="hint" data-i18n="autosave"></span>
      <span class="status" id="save-status" data-tone="idle"></span>
      <span class="spacer"></span>
      <button class="btn quiet" id="reset" type="button" data-i18n="reset"></button>
    </footer>
  </main>

  <dialog id="reset-confirm" class="confirm">
    <h2 data-i18n="reset"></h2>
    <p data-i18n="resetWarning"></p>
    <div class="confirm-buttons">
      <button class="btn" id="reset-cancel" type="button" data-i18n="cancel"></button>
      <button class="btn danger" id="reset-go" type="button" data-i18n="reset"></button>
    </div>
  </dialog>

  <script src="../lib/namespace.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/patterns.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
